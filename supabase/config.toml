project_id = "vmiyqfkcoqdnkxjnxijt"

# ⚠️ 주의 — `supabase config push` 는 확인 프롬프트 없이 즉시 적용되며,
#    이 파일에 없는 항목은 CLI 기본값으로 '덮어쓴다'.
#    따라서 원격의 기존 설정을 여기에 전부 명시해 두어야 한다.
#    (2026-08-16: 최소 config.toml 로 push 했다가 site_url·redirect URL 이 로컬 기본값으로
#     초기화되는 사고가 있었음. 아래 값들은 그때 복구한 운영값이다.)

[auth]
enabled = true
site_url = "https://waat.community"
additional_redirect_urls = [
  "https://wed-night-ai-talk.vercel.app",
  "https://wed-night-ai-talk.vercel.app/**",
  "http://localhost:*/**",
  "https://waat.community/**",
  "https://www.waat.community/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# 이메일 인증 — 가입 시 확인 메일을 보내고 링크를 눌러야 계정이 확정된다.
enable_confirmations = true

# 확인 메일 템플릿(한글) — 2026-08-16 적용.
#   본문 원본: supabase/templates/confirmation-ko.html
#   제목:     [WAAT] 이메일 인증을 완료해 주세요
# ⚠️ 적용은 `config push` 가 아니라 Management API PATCH 로 했다
#    (config push 는 이 파일에 없는 설정을 CLI 기본값으로 덮어쓴다 — 위 경고 참조).
#    아래 template 블록은 기록용이며, push 하려면 다른 설정 유실 여부를 먼저 확인할 것.
# [auth.email.template.confirmation]
# subject = "[WAAT] 이메일 인증을 완료해 주세요"
# content_path = "./templates/confirmation-ko.html"
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600
